<section class="card">
  <h1>Créer un compte</h1>
  <form [formGroup]="form" (ngSubmit)="submit()">
    <label>Nom<input formControlName="name" /></label>
    <label>Email<input type="email" formControlName="email" /></label>
    <label>Mot de passe<input type="password" formControlName="password" /></label>
    <app-avatar-picker [value]="form.controls.avatar.value" [buttonLabel]="'Choisir une photo de profil'" (valueChange)="setAvatar($event)" />
    <button type="submit">Créer mon compte</button>
  </form>
  @if (error()) {
    <p class="error">{{ error() }}</p>
  }
  <p><a routerLink="/login">Déjà inscrit ?</a></p>
</section>
