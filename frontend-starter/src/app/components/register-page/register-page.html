<section class="card">
  <h1>Créer un compte</h1>
  <form [formGroup]="form" (ngSubmit)="submit()" autocomplete="off">
    <label>Nom<input id="register-display-name" name="new_account_display_name" formControlName="name" autocomplete="off" minlength="1" required />
      @if (form.controls.name.touched && form.controls.name.invalid) { <span class="error" role="alert">Le nom doit contenir au moins 1 caractère.</span> }
    </label>
    <label>Email<input id="register-email" name="new_account_email" type="email" formControlName="email" autocomplete="off" minlength="8" required />
      @if (form.controls.email.touched && form.controls.email.hasError('minlength')) { <span class="error" role="alert">L’email doit contenir au moins 8 caractères.</span> }
      @else if (form.controls.email.touched && form.controls.email.invalid) { <span class="error" role="alert">Saisis une adresse email valide.</span> }
    </label>
    <label>Mot de passe<input id="register-password" name="new_account_password" type="password" formControlName="password" autocomplete="new-password" minlength="8" required />
      @if (form.controls.password.touched && form.controls.password.invalid) { <span class="error" role="alert">Le mot de passe doit contenir au moins 8 caractères.</span> }
    </label>
    <app-avatar-picker [value]="form.controls.avatar.value" [buttonLabel]="'Choisir une photo de profil'" (valueChange)="setAvatar($event)" />
    <button type="submit" [disabled]="form.invalid">Créer mon compte</button>
  </form>
  @if (error()) {
    <p class="error">{{ error() }}</p>
  }
  <p><a routerLink="/login">Déjà inscrit ?</a></p>
</section>
